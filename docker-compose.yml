services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: bookingflow-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - bookingflow


  nginx:
    image: nginx:latest

    container_name: bookingflow-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - bookingflow


  mysql:
    image: mysql:8.0

    container_name: bookingflow-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: bookingflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bookingflow
      MYSQL_PASSWORD: secret

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - bookingflow


volumes:
  mysql_data:


networks:
  bookingflow:
    driver: bridge
